<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dcouplr-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="dcouplr-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#39ff14" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Base -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#dcouplr-bg-grad)" stroke="#39ff14" stroke-width="2.5" stroke-opacity="0.5" />

  <style>
    .bracket {
      fill: #39ff14;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, Monaco, monospace;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -1.5px;
    }
    .char-d {
      fill: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 35px;
      letter-spacing: -0.5px;
    }
    @media (prefers-color-scheme: light) {
      /* Squircle ensures maximum contrast and vibrant neon pop on light browser tabs */
    }
  </style>

  <!-- Perfectly Centered <d/> Logo Glyphs -->
  <text x="50" y="62" text-anchor="middle">
    <tspan class="bracket" filter="url(#dcouplr-neon-glow)">&lt;</tspan><tspan dx="1.5" class="char-d">d</tspan><tspan dx="1.5" class="bracket" filter="url(#dcouplr-neon-glow)">/&gt;</tspan>
  </text>
</svg>