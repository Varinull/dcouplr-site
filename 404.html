<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Not Found | &lt;dcouplr/&gt;</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      background: #060911;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .not-found-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 540px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .code-badge {
      font-family: monospace;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.85rem; margin: 0 0 1rem; color: #ffffff; }
    p { font-size: 0.92rem; color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
    .btn-home {
      display: inline-block;
      background: #00e5ff;
      color: #060911;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: #38bdf8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="not-found-card">
    <span class="code-badge">404 NOT FOUND</span>
    <h1>Page Restricted or Not Found</h1>
    <p>The requested resource does not exist on this public website. In-VPC appliances, administration consoles, and compilers operate strictly inside private customer RFC 1918 networks.</p>
    <a href="/" class="btn-home">Return to dcouplr.com &rarr;</a>
  </div>
</body>
</html>
