<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none">
  <defs>
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#39ff14" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background rounded card (subtle light neutral matching user asset) -->
  <rect x="2" y="2" width="316" height="68" rx="10" fill="#f4f5f7" stroke="#e5e7eb" stroke-width="1.5"/>
  
  <g font-family="'JetBrains Mono', 'Fira Code', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" text-anchor="middle" dominant-baseline="central">
    <!-- Opening neon-lime angle bracket < -->
    <text x="38" y="37" fill="#39ff14" filter="url(#neon-glow)">&lt;</text>
    
    <!-- Wordmark dcouplr in dark charcoal gray -->
    <text x="150" y="37" fill="#262626" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="38" letter-spacing="-0.5px">dcouplr</text>
    
    <!-- Closing neon-lime forward slash and bracket /> -->
    <text x="268" y="37" fill="#39ff14" filter="url(#neon-glow)">/&gt;</text>
  </g>
</svg>
